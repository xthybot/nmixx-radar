[project]
name = "idol-site-py"
version = "0.1.0"
description = "Python FastAPI version of the NMIXX idol site."
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.116.0",
    "httpx2>=2.10.0",
    "jinja2>=3.1.6",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.20",
    "pywebpush>=2.4.0",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.35.0",
]

[tool.uv]
package = false
